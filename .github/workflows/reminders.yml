name: Dispatch push reminders

# Calls the reminder endpoint every 5 minutes so FCM pushes go out even when nobody has the app open.
# Needs repository variable APP_URL (e.g. https://mediscan.example.com) and secret CRON_SECRET.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.APP_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/reminders
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_URL }}/api/cron/reminders"
